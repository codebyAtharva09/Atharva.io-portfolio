<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="scBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#031014;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#04181d;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="scGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#scBg)" />
  <rect width="800" height="450" fill="url(#scGlow)" />

  <!-- hex grid backdrop -->
  <g stroke="rgba(16,185,129,0.08)" stroke-width="1" fill="none">
    <path d="M0 60 L800 60 M0 140 L800 140 M0 220 L800 220 M0 300 L800 300 M0 380 L800 380" />
  </g>

  <!-- molecule graph: ring + substituents -->
  <g stroke="rgba(16,185,129,0.55)" stroke-width="2" fill="none" stroke-linecap="round">
    <polygon points="400,150 460,185 460,255 400,290 340,255 340,185" />
    <line x1="460" y1="185" x2="520" y2="150" />
    <line x1="460" y1="255" x2="520" y2="290" />
    <line x1="340" y1="185" x2="280" y2="150" />
    <line x1="340" y1="255" x2="280" y2="290" />
    <line x1="400" y1="150" x2="400" y2="100" />
    <line x1="400" y1="290" x2="400" y2="340" />
  </g>
  <g fill="rgba(16,185,129,0.85)">
    <circle cx="400" cy="150" r="5" />
    <circle cx="460" cy="185" r="5" />
    <circle cx="460" cy="255" r="5" />
    <circle cx="400" cy="290" r="5" />
    <circle cx="340" cy="255" r="5" />
    <circle cx="340" cy="185" r="5" />
    <circle cx="520" cy="150" r="4" fill="rgba(56,189,248,0.8)" />
    <circle cx="520" cy="290" r="4" fill="rgba(56,189,248,0.8)" />
    <circle cx="280" cy="150" r="4" fill="rgba(56,189,248,0.8)" />
    <circle cx="280" cy="290" r="4" fill="rgba(56,189,248,0.8)" />
    <circle cx="400" cy="100" r="4" fill="rgba(244,114,182,0.8)" />
    <circle cx="400" cy="340" r="4" fill="rgba(244,114,182,0.8)" />
  </g>

  <!-- flask silhouette -->
  <g stroke="rgba(56,189,248,0.35)" stroke-width="2" fill="none">
    <path d="M150 120 L150 170 L100 260 Q95 275 110 275 L210 275 Q225 275 220 260 L170 170 L170 120" />
    <line x1="140" y1="120" x2="180" y2="120" />
  </g>
  <path d="M110 275 L210 275 Q225 275 220 260 L200 225 L120 225 L110 260 Q108 268 110 275 Z" fill="rgba(16,185,129,0.12)" stroke="none" />

  <text x="150" y="330" text-anchor="middle" font-family="monospace" font-size="10" fill="rgba(16,185,129,0.4)" letter-spacing="2">CRO / CDMO</text>
  <text x="400" y="400" text-anchor="middle" font-family="monospace" font-size="11" fill="rgba(16,185,129,0.45)" letter-spacing="3">SPARGECHEM.COM</text>
  <text x="400" y="30" text-anchor="middle" font-family="monospace" font-size="10" fill="rgba(16,185,129,0.35)" letter-spacing="2">NEXT.JS · RDKIT · POSTGRESQL</text>
