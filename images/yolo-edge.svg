<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020c18;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#041424;stop-opacity:1" />
    </linearGradient>

    <!-- Cyan glow filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Strong glow -->
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Subtle glow -->
    <filter id="subtleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Clip paths -->
    <clipPath id="mainClip">
      <rect width="800" height="450" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#mainClip)">

    <!-- Background -->
    <rect width="800" height="450" fill="url(#bgGrad)"/>

    <!-- Grid pattern -->
    <g opacity="0.07" stroke="#06b6d4" stroke-width="0.5">
      <!-- Vertical lines -->
      <line x1="50"  y1="0" x2="50"  y2="450"/>
      <line x1="100" y1="0" x2="100" y2="450"/>
      <line x1="150" y1="0" x2="150" y2="450"/>
      <line x1="200" y1="0" x2="200" y2="450"/>
      <line x1="250" y1="0" x2="250" y2="450"/>
      <line x1="300" y1="0" x2="300" y2="450"/>
      <line x1="350" y1="0" x2="350" y2="450"/>
      <line x1="400" y1="0" x2="400" y2="450"/>
      <line x1="450" y1="0" x2="450" y2="450"/>
      <line x1="500" y1="0" x2="500" y2="450"/>
      <line x1="550" y1="0" x2="550" y2="450"/>
      <line x1="600" y1="0" x2="600" y2="450"/>
      <line x1="650" y1="0" x2="650" y2="450"/>
      <line x1="700" y1="0" x2="700" y2="450"/>
      <line x1="750" y1="0" x2="750" y2="450"/>
      <!-- Horizontal lines -->
      <line x1="0" y1="50"  x2="800" y2="50"/>
      <line x1="0" y1="100" x2="800" y2="100"/>
      <line x1="0" y1="150" x2="800" y2="150"/>
      <line x1="0" y1="200" x2="800" y2="200"/>
      <line x1="0" y1="250" x2="800" y2="250"/>
      <line x1="0" y1="300" x2="800" y2="300"/>
      <line x1="0" y1="350" x2="800" y2="350"/>
      <line x1="0" y1="400" x2="800" y2="400"/>
    </g>

    <!-- ── CONVEYOR BELT (industrial context) ── -->
    <!-- Belt surface -->
    <rect x="0" y="310" width="800" height="60" fill="#0a1520" stroke="#1e3a4a" stroke-width="1"/>
    <!-- Belt texture lines -->
    <g stroke="#0d2030" stroke-width="1.5">
      <line x1="0" y1="320" x2="800" y2="320"/>
      <line x1="0" y1="330" x2="800" y2="330"/>
      <line x1="0" y1="340" x2="800" y2="340"/>
      <line x1="0" y1="350" x2="800" y2="350"/>
      <line x1="0" y1="360" x2="800" y2="360"/>
    </g>
    <!-- Belt edge highlight -->
    <rect x="0" y="310" width="800" height="2" fill="#06b6d4" opacity="0.3"/>
    <rect x="0" y="368" width="800" height="2" fill="#06b6d4" opacity="0.15"/>

    <!-- ── INDUSTRIAL PARTS ON BELT ── -->
    <!-- Part 1 - circular gear (left) -->
    <g transform="translate(110,310)" opacity="0.85">
      <circle cx="0" cy="0" r="38" fill="#0f2535" stroke="#1a3a50" stroke-width="2"/>
      <circle cx="0" cy="0" r="28" fill="#0a1d2e" stroke="#1a3a50" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="10" fill="#06232e" stroke="#06b6d4" stroke-width="1" opacity="0.6"/>
      <!-- Gear teeth -->
      <g fill="#1a3a50">
        <rect x="-5" y="-44" width="10" height="10" rx="2"/>
        <rect x="-5" y="34"  width="10" height="10" rx="2"/>
        <rect x="-44" y="-5" width="10" height="10" rx="2"/>
        <rect x="34"  y="-5" width="10" height="10" rx="2"/>
        <rect x="-33" y="-33" width="9" height="9" rx="2" transform="rotate(45 -28.5 -28.5)"/>
        <rect x="24"  y="-33" width="9" height="9" rx="2" transform="rotate(45 28.5 -28.5)"/>
        <rect x="-33" y="24"  width="9" height="9" rx="2" transform="rotate(45 -28.5 28.5)"/>
        <rect x="24"  y="24"  width="9" height="9" rx="2" transform="rotate(45 28.5 28.5)"/>
      </g>
    </g>

    <!-- Part 2 - circuit board (center) -->
    <g transform="translate(370,310)">
      <rect x="-55" y="-38" width="110" height="76" rx="4" fill="#081820" stroke="#1a3a50" stroke-width="1.5"/>
      <!-- IC chip -->
      <rect x="-22" y="-18" width="44" height="36" rx="3" fill="#0a2030" stroke="#1e3a4a" stroke-width="1"/>
      <!-- Chip pins left -->
      <g fill="#1e3a4a">
        <rect x="-30" y="-14" width="8" height="4" rx="1"/>
        <rect x="-30" y="-6"  width="8" height="4" rx="1"/>
        <rect x="-30" y="2"   width="8" height="4" rx="1"/>
        <rect x="-30" y="10"  width="8" height="4" rx="1"/>
      </g>
      <!-- Chip pins right -->
      <g fill="#1e3a4a">
        <rect x="22" y="-14" width="8" height="4" rx="1"/>
        <rect x="22" y="-6"  width="8" height="4" rx="1"/>
        <rect x="22" y="2"   width="8" height="4" rx="1"/>
        <rect x="22" y="10"  width="8" height="4" rx="1"/>
      </g>
      <!-- Trace lines on PCB -->
      <g stroke="#0d2535" stroke-width="1" fill="none">
        <polyline points="-45,20 -35,20 -35,30 30,30 30,20 45,20"/>
        <polyline points="-45,-25 -40,-25 -40,-30 40,-30 40,-25 45,-25"/>
        <circle cx="35" cy="25" r="3" fill="#06b6d4" opacity="0.5"/>
        <circle cx="-35" cy="25" r="3" fill="#06b6d4" opacity="0.5"/>
      </g>
    </g>

    <!-- Part 3 - metal component (right) -->
    <g transform="translate(640,310)" opacity="0.85">
      <rect x="-40" y="-30" width="80" height="58" rx="6" fill="#0a1520" stroke="#1a3a50" stroke-width="1.5"/>
      <rect x="-28" y="-20" width="56" height="38" rx="3" fill="#061018" stroke="#0d2535" stroke-width="1"/>
      <g fill="#1a3a50">
        <circle cx="-32" cy="-24" r="4"/>
        <circle cx="32"  cy="-24" r="4"/>
        <circle cx="-32" cy="24"  r="4"/>
        <circle cx="32"  cy="24"  r="4"/>
      </g>
      <rect x="-12" y="-8" width="24" height="14" rx="2" fill="#0d2535" stroke="#1e3a4a" stroke-width="1"/>
    </g>

    <!-- ── SCAN LINE ── -->
    <line x1="0" y1="195" x2="800" y2="195" stroke="#06b6d4" stroke-width="1.5" opacity="0.6" filter="url(#cyanGlow)"/>
    <rect x="0" y="175" width="800" height="40" fill="url(#bgGrad)" opacity="0.0">
      <!-- Gradient scan overlay -->
    </rect>
    <!-- Scan glow band -->
    <rect x="0" y="185" width="800" height="20" fill="#06b6d4" opacity="0.04"/>

    <!-- ── DEFECT DETECTED (Part 1) — CYAN BOX ── -->
    <!-- Main bounding box -->
    <g filter="url(#cyanGlow)">
      <rect x="62" y="220" width="96" height="96" rx="2"
            fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.9"/>
      <!-- Corner accents -->
      <!-- TL -->
      <polyline points="62,242 62,220 84,220" fill="none" stroke="#06b6d4" stroke-width="3"/>
      <!-- TR -->
      <polyline points="136,220 158,220 158,242" fill="none" stroke="#06b6d4" stroke-width="3"/>
      <!-- BL -->
      <polyline points="62,294 62,316 84,316" fill="none" stroke="#06b6d4" stroke-width="3"/>
      <!-- BR -->
      <polyline points="136,316 158,316 158,294" fill="none" stroke="#06b6d4" stroke-width="3"/>
    </g>
    <!-- Label background -->
    <rect x="62" y="205" width="102" height="18" rx="3" fill="#06b6d4" opacity="0.9"/>
    <text x="113" y="218" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#000">DEFECT 97.3%</text>
    <!-- Crosshair -->
    <g stroke="#06b6d4" stroke-width="1" opacity="0.5">
      <line x1="110" y1="248" x2="110" y2="288"/>
      <line x1="90"  y1="268" x2="130" y2="268"/>
    </g>

    <!-- ── NO DEFECT (Part 2 — center) — GREEN BOX ── -->
    <g filter="url(#subtleGlow)">
      <rect x="316" y="225" width="108" height="90" rx="2"
            fill="none" stroke="#10b981" stroke-width="2" opacity="0.85"/>
      <!-- Corner accents -->
      <polyline points="316,245 316,225 336,225" fill="none" stroke="#10b981" stroke-width="3"/>
      <polyline points="404,225 424,225 424,245" fill="none" stroke="#10b981" stroke-width="3"/>
      <polyline points="316,295 316,315 336,315" fill="none" stroke="#10b981" stroke-width="3"/>
      <polyline points="404,315 424,315 424,295" fill="none" stroke="#10b981" stroke-width="3"/>
    </g>
    <rect x="316" y="210" width="108" height="18" rx="3" fill="#10b981" opacity="0.9"/>
    <text x="370" y="223" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#000">OK  99.1%</text>

    <!-- ── DEFECT (Part 3) — ORANGE BOX ── -->
    <g filter="url(#subtleGlow)">
      <rect x="592" y="226" width="96" height="88" rx="2"
            fill="none" stroke="#f97316" stroke-width="2" opacity="0.9"/>
      <polyline points="592,246 592,226 612,226" fill="none" stroke="#f97316" stroke-width="3"/>
      <polyline points="668,226 688,226 688,246" fill="none" stroke="#f97316" stroke-width="3"/>
      <polyline points="592,294 592,314 612,314" fill="none" stroke="#f97316" stroke-width="3"/>
      <polyline points="668,314 688,314 688,294" fill="none" stroke="#f97316" stroke-width="3"/>
    </g>
    <rect x="592" y="211" width="96" height="18" rx="3" fill="#f97316" opacity="0.9"/>
    <text x="640" y="224" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#000">CRACK 89.7%</text>
    <!-- Defect markers inside box -->
    <g stroke="#f97316" stroke-width="1.5" opacity="0.6">
      <line x1="618" y1="250" x2="665" y2="305"/>
      <circle cx="640" cy="276" r="8" fill="none" stroke="#f97316" stroke-width="1.5" opacity="0.5"/>
    </g>

    <!-- ── PIPELINE FLOW (top area) ── -->
    <!-- Pipeline stages -->
    <g transform="translate(0, 48)">
      <!-- Stage nodes -->
      <!-- PyTorch -->
      <rect x="30" y="0" width="90" height="28" rx="14" fill="#0f2535" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="75" y="18" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" fill="#93c5fd">PyTorch</text>
      <!-- Arrow -->
      <polyline points="120,14 138,14" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#arrowBlue)" opacity="0.7"/>
      <polygon points="135,10 143,14 135,18" fill="#3b82f6" opacity="0.7"/>

      <!-- ONNX -->
      <rect x="145" y="0" width="80" height="28" rx="14" fill="#0f2535" stroke="#a855f7" stroke-width="1.5"/>
      <text x="185" y="18" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" fill="#c4b5fd">ONNX</text>
      <polyline points="225,14 243,14" stroke="#a855f7" stroke-width="1.5" fill="none" opacity="0.7"/>
      <polygon points="240,10 248,14 240,18" fill="#a855f7" opacity="0.7"/>

      <!-- MLIR -->
      <rect x="250" y="0" width="80" height="28" rx="14" fill="#0f2535" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="290" y="18" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" fill="#c4b5fd">MLIR</text>
      <polygon points="330,10 338,14 330,18" fill="#8b5cf6" opacity="0.7"/>

      <!-- INT8 -->
      <rect x="340" y="0" width="90" height="28" rx="14" fill="#0f2535" stroke="#06b6d4" stroke-width="1.5"/>
      <text x="385" y="18" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" fill="#67e8f9">INT8 Quant</text>
      <polygon points="430,10 438,14 430,18" fill="#06b6d4" opacity="0.7"/>

      <!-- Edge -->
      <rect x="440" y="0" width="100" height="28" rx="14" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1.5"/>
      <text x="490" y="18" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" fill="#06b6d4" font-weight="bold">Edge Deploy</text>
    </g>

    <!-- ── STATS PANEL (top right) ── -->
    <rect x="570" y="10" width="220" height="125" rx="10" fill="#060e18" stroke="#0d2535" stroke-width="1.5"/>
    <rect x="570" y="10" width="220" height="28" rx="10" fill="#0a1d2e"/>
    <rect x="570" y="28" width="220" height="10" rx="0" fill="#0a1d2e"/>
    <text x="680" y="28" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" fill="#64748b">DETECTION STATS</text>

    <!-- Stats rows -->
    <g font-family="'Fira Code', monospace" font-size="11">
      <text x="585" y="58"  fill="#64748b">mAP@0.5</text>
      <text x="775" y="58"  text-anchor="end" fill="#06b6d4" font-weight="bold">94.7%</text>
      <rect x="660" y="50" width="80" height="5" rx="2" fill="#0d2535"/>
      <rect x="660" y="50" width="75" height="5" rx="2" fill="#06b6d4" opacity="0.8"/>

      <text x="585" y="80"  fill="#64748b">Precision</text>
      <text x="775" y="80"  text-anchor="end" fill="#10b981" font-weight="bold">96.2%</text>
      <rect x="660" y="72" width="80" height="5" rx="2" fill="#0d2535"/>
      <rect x="660" y="72" width="77" height="5" rx="2" fill="#10b981" opacity="0.8"/>

      <text x="585" y="102" fill="#64748b">FPS (Edge)</text>
      <text x="775" y="102" text-anchor="end" fill="#a855f7" font-weight="bold">28 fps</text>
      <rect x="660" y="94" width="80" height="5" rx="2" fill="#0d2535"/>
      <rect x="660" y="94" width="56" height="5" rx="2" fill="#a855f7" opacity="0.8"/>

      <text x="585" y="124" fill="#64748b">Model Size</text>
      <text x="775" y="124" text-anchor="end" fill="#f97316" font-weight="bold">3.2 MB</text>
      <rect x="660" y="116" width="80" height="5" rx="2" fill="#0d2535"/>
      <rect x="660" y="116" width="20" height="5" rx="2" fill="#f97316" opacity="0.8"/>
    </g>

    <!-- ── CAMERA / SENSOR ICON (top left) ── -->
    <rect x="10" y="10" width="130" height="36" rx="8" fill="#060e18" stroke="#0d2535" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="6" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="2.5" fill="#06b6d4" opacity="0.8"/>
    <rect x="38" y="18" width="2" height="20" fill="#0d2535"/>
    <text x="48" y="24" font-family="'Fira Code', monospace" font-size="9" fill="#64748b">MaixCAM</text>
    <text x="48" y="36" font-family="'Fira Code', monospace" font-size="9" fill="#06b6d4">● LIVE</text>

    <!-- Frame counter -->
    <rect x="10" y="54" width="130" height="24" rx="6" fill="#060e18" stroke="#0d2535" stroke-width="1"/>
    <text x="20" y="70" font-family="'Fira Code', monospace" font-size="9" fill="#64748b">Frame: </text>
    <text x="65" y="70" font-family="'Fira Code', monospace" font-size="9" fill="#10b981">004821</text>
    <text x="105" y="70" font-family="'Fira Code', monospace" font-size="9" fill="#64748b">30Hz</text>

    <!-- Bottom status bar -->
    <rect x="0" y="425" width="800" height="25" fill="#04101a"/>
    <rect x="0" y="425" width="800" height="1" fill="#0d2535"/>
    <g font-family="'Fira Code', monospace" font-size="9" fill="#3a6a80">
      <text x="15"  y="440">YOLO v8 · INT8 · CVITEK NPU</text>
      <text x="250" y="440" fill="#06b6d4">■ DEFECT: 2</text>
      <text x="360" y="440" fill="#10b981">■ OK: 1</text>
      <text x="440" y="440">Inference: 36ms</text>
      <text x="580" y="440">RAMS Inspect AI System v1.0</text>
    </g>

    <!-- Outer frame border -->
    <rect x="1" y="1" width="798" height="448" rx="0" fill="none" stroke="#0d2535" stroke-width="2"/>

    <!-- Corner decorations -->
    <g stroke="#06b6d4" stroke-width="2" fill="none" opacity="0.4">
      <polyline points="1,20 1,1 20,1"/>
      <polyline points="780,1 799,1 799,20"/>
      <polyline points="1,430 1,449 20,449"/>
      <polyline points="780,449 799,449 799,430"/>
    </g>

  </g>
</svg>
